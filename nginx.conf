server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 50m;

    # La API no se proxea aquí: en producción (Dokploy) Traefik enruta /api/* directo al
    # backend por Path, como app aparte (ADR-0012). En el docker-compose de demo local de
    # Carpeta_Viva se sigue usando infra/nginx/default.conf, que sí hace proxy_pass.

    # Configuración en tiempo de ejecución y entrada de la app: nunca en caché
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Archivos compilados con hash en el nombre: caché larga
    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
